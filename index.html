<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>createEncodedSink Test</title>
</head>
<body>
    <h1>createEncodedSink Test</h1>
    
    <div>
        <button id="startButton">Start Media</button>
        <button id="connectButton" disabled>Connect (Inject)</button>
        <button id="hangupButton" disabled>Hangup</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Local Preview (Muted)</h3>
        <video id="localVideo" autoplay playsinline muted style="width: 320px; height: 240px; background: black;"></video>
    </div>
    <div>
        <h3>PC1 Remote (Normal PC Pair)</h3>
        <video id="remoteVideo1" autoplay playsinline style="width: 320px; height: 240px; background: black;"></video>
    </div>
    <div>
        <h3>PC2 Remote (Injected PC Pair)</h3>
        <video id="remoteVideo2" autoplay playsinline style="width: 320px; height: 240px; background: black;"></video>
    </div>

    <script src="main.js"></script>
</body>
</html>
