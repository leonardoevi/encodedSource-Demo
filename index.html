<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebCodecs + EncodedSource Test</title>
</head>
<body>
    <h1>WebCodecs + EncodedSource Injection Test</h1>
    
    <div>
        <button id="startButton">Start Media</button>
        <button id="connectButton" disabled>Connect (Inject)</button>
        <button id="hangupButton" disabled>Hangup</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Local Preview (Muted)</h3>
        <video id="localVideo" autoplay playsinline muted style="width: 320px; height: 240px; background: black;"></video>
    </div>
    <div>
        <h3>Remote Injected <span id="audioIndicator" style="display:inline-block; width: 12px; height: 12px; border-radius: 50%; background-color: gray; margin-left: 8px; transition: background-color 0.1s;"></span></h3>
        <video id="remoteVideo" autoplay playsinline style="width: 320px; height: 240px; background: black;"></video>
    </div>

    <script src="main.js"></script>
</body>
</html>
