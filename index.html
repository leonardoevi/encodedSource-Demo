<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RTCRtpSender.createEncodedSink Test</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        .video-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        video {
            width: 320px;
            height: 240px;
            background: #222;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #controls {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>RTCRtpSender.createEncodedSink Test</h1>
    
    <div id="controls">
        <button id="startButton">Start Media</button>
        <button id="connectButton" disabled>Connect</button>
        <button id="hangupButton" disabled>Hangup</button>
        <button id="requestKeyframeButton1">Request Keyframe (PC1 Remote)</button>
        <button id="requestKeyframeButton">Request Keyframe (PC2 Remote)</button>
        <button id="dropNextFrameButton">Drop Next Frame (Worker 2)</button>
        <label style="margin-left: 15px; font-size: 16px;">
            <input type="checkbox" id="dropAllToggle"> Drop All Frames (Worker 2)
        </label>
    </div>

    <div class="video-container">
        <div class="video-box">
            <h3>Local Preview</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
            <h3>PC1 Remote (Usual Connection)</h3>
            <video id="remoteVideo1" autoplay playsinline></video>
        </div>
        <div class="video-box">
            <h3>PC2 Remote (Sink Connection)</h3>
            <video id="remoteVideo2" autoplay playsinline></video>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
