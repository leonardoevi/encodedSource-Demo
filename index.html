<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebCodecs + EncodedSource Test</title>
</head>
<body>
    <h1>WebCodecs + EncodedSource Injection Test</h1>
    
    <div>
        <button id="startButton">Start Media</button>
        <button id="connectButton" disabled>Connect (Inject)</button>
        <button id="hangupButton" disabled>Hangup</button>
        <button id="requestKeyframeButton" disabled>Request Keyframe</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Local Preview (Muted)</h3>
        <video id="localVideo" autoplay playsinline muted style="width: 320px; height: 240px; background: black;"></video>
    </div>
    <div>
        <h3>Remote Injected</h3>
        <video id="remoteVideo" autoplay playsinline style="width: 320px; height: 240px; background: black;"></video>
        <div style="margin-top: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; line-height: 1.6;">
            <div id="audioBitrate" style="margin-bottom: 10px;">
                <span style="font-weight: bold;">Audio:</span><br>allocatedBitrate: <span style="font-weight: 600; color: #0969da;">-</span><br>availableOutgoingBitrate: <span style="font-weight: 600; color: #0969da;">-</span>
            </div>
            <div id="videoBitrate">
                <span style="font-weight: bold;">Video:</span><br>allocatedBitrate: <span style="font-weight: 600; color: #0969da;">-</span><br>availableOutgoingBitrate: <span style="font-weight: 600; color: #0969da;">-</span>
            </div>
            <div id="keyframeNotice" style="margin-top: 10px; font-weight: bold; color: #cf222e; min-height: 1.3em; opacity: 0;"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
